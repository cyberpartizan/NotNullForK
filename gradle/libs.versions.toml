[versions]
kotlin = "2.2.21"
# Newest KSP that works with both Kotlin 1.9 (measured; ADR 0004) and the latest Kotlin; 2.2.x+ needs KGP 2.2.
ksp = "2.1.21-2.0.2"
kotlinpoet = "2.2.0"
# The runtime is compiled against the oldest supported Spring Boot; the consumer's Boot version wins at runtime.
spring-boot-min = "3.0.13"
junit = "5.11.4"
assertj = "3.27.3"
plugin-publish = "1.3.1"

[libraries]
# The processor is compiled against the oldest KSP it runs on, the KSP1 of Kotlin 1.8.22 (ADR 0004).
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version = "1.8.22-1.0.11" }
ksp-aa-embeddable = { module = "com.google.devtools.ksp:symbol-processing-aa-embeddable", version.ref = "ksp" }
ksp-common-deps = { module = "com.google.devtools.ksp:symbol-processing-common-deps", version.ref = "ksp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version = "1.6.4" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-min" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot-min" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version = "3.0.2" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
